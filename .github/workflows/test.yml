# GitHub only reads workflows from .github/workflows/. A file anywhere else —
# the repo root, for instance — is inert: no run, no error, no clue. That is
# why build.yml never once executed.

name: Tests

# Every push to any branch, so a branch gets a verdict before it becomes a
# pull request, plus pull_request so that contributions from forks are
# checked too. A same-repo PR therefore runs twice; that is the cost of
# covering forks, and on a public repo the minutes are free.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow needs the code and nothing else. The release
# workflow asks for more, and only in the job that needs it.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, rather than stopping at the first
      # failure — "3.10 fails, 3.13 passes" is the useful shape of the answer.
      fail-fast: false
      matrix:
        # 3.10 is the floor the README advertises; 3.13 is the newest stable.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Runtime dependencies only. The tests import npm_api, which needs
      # requests, typer and rich; they do not need PyInstaller, and they
      # reach no network and no live NPM.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Through the Makefile deliberately, so CI exercises the same entry
      # point a developer types. With no ./venv present it falls back to the
      # interpreter setup-python selected.
      - name: Run the test suite
        run: make test

      # Nothing above proves the CLI can start: every test imports the module
      # directly. A missing import or a decorator typo would pass the suite
      # and fail the first real invocation.
      - name: Check the CLI starts
        run: python npm_api.py --help
